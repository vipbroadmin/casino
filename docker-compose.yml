version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skeleton-postgres
    environment:
      POSTGRES_DB: skeleton
      POSTGRES_USER: skeleton
      POSTGRES_PASSWORD: skeleton123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skeleton -d skeleton"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
