version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skeleton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skeleton
      POSTGRES_USER: skeleton
      POSTGRES_PASSWORD: skeleton123
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skeleton -d skeleton"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: players-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HTTP_PORT: ${APP_HTTP_PORT:-8088}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "${APP_HTTP_PORT:-8088}:${APP_HTTP_PORT:-8088}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
